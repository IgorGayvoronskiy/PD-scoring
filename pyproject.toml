[project]
name = "pd-scoring-service"
version = "0.2.3"
description = "PD-scoring service"
requires-python=">=3.11,<3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "scikit-learn>=1.6,<1.7",
    "joblib",
    "psycopg[binary]",
    "catboost",
    "shap",
    "python-multipart",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff",
    "requests"
]

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pd_scoring"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: нужна база данных = адрес в DATABASE_URL"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
